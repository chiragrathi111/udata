<!DOCTYPE html>
<html><head>
<title>Student Portal</title>
<style>
  body{font-family:Arial;max-width:900px;margin:40px auto;padding:20px}
  input,select{padding:8px;margin:4px;border:1px solid #ddd;border-radius:6px}
  button{padding:8px 16px;margin:4px;background:#534AB7;color:white;border:none;border-radius:6px;cursor:pointer}
  table{width:100%;border-collapse:collapse;margin-top:20px}
  th,td{padding:10px;border:1px solid #ddd;text-align:left}
  th{background:#f5f5f5}
  .msg{padding:10px;margin:10px 0;border-radius:6px;background:#EAF3DE;color:#27500A}
</style>
</head><body>
<h2>Student Portal</h2>
<div style="background:#f9f9f9;padding:16px;border-radius:8px;margin-bottom:20px">
  <input id="name" placeholder="Full Name" style="width:180px">
  <input id="email" placeholder="Email" style="width:180px">
  <input id="course" placeholder="Course" style="width:140px">
  <input id="marks" placeholder="Marks" type="number" style="width:80px">
  <button onclick="addStudent()">Add Student</button>
  <button onclick="loadStudents()" style="background:#1D9E75">Refresh</button>
</div>
<div id="msg"></div>
<table id="tbl">
  <tr><th>Student ID</th><th>Name</th><th>Email</th><th>Course</th><th>Marks</th><th>Action</th></tr>
</table>
<script>
const API = 'https://YOUR_API_URL/prod/students';
async function loadStudents() {
  const r = await fetch(API);
  const data = await r.json();
  const t = document.getElementById('tbl');
  t.innerHTML = '<tr><th>Student ID</th><th>Name</th><th>Email</th><th>Course</th><th>Marks</th><th>Action</th></tr>';
  data.forEach(s => {
    t.innerHTML += "<tr><td>"+s.studentId.substring(0,8)+"...</td><td>"+s.name+"</td><td>"+s.email+"</td><td>"+s.course+"</td><td>"+s.marks+"</td><td><button onclick='delStudent(\""+s.studentId+"\")' style='background:#E24B4A;padding:4px 10px'>Delete</button></td></tr>";
  });
}
async function addStudent() {
  const r = await fetch(API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      name:   document.getElementById('name').value,
      email:  document.getElementById('email').value,
      course: document.getElementById('course').value,
      marks:  parseInt(document.getElementById('marks').value)||0
    })
  });
  document.getElementById('msg').innerHTML = '<div class="msg">Student added!</div>';
  loadStudents();
}
async function delStudent(id) {
  await fetch(API+'?studentId='+id, {method:'DELETE'});
  loadStudents();
}
loadStudents();
</script>
</body></html>
