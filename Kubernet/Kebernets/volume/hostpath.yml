kind: Pod
apiVersion: v1
metadata:
  name: myapp-pod
spec:
  containers:
    - name: c3
      image: nginx
      ports:
        - containerPort: 80
      volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: my-hostpath-volume
  volumes:
    - name: my-hostpath-volume
      hostPath:
        path: /data
