apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: myrs
spec:
  replicas: 2
  selector:
    matchExpressions:
      - key: myname
        operator: In
        values:
          - Chirag
      - key: env
        operator: NotIn
        values:
          - production
  template:
    metadata:
      labels:
        myname: Chirag
        env: dev
    spec:
      containers:
        - name: c04
          image: ubuntu
          command:
            - /bin/bash
            - -c
            - while true; do echo Chirag; sleep 5; done