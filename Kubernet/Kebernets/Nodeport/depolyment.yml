kind: Deployment
apiVersion: apps/v1
metadata:
  name: my-deployment-nodeport
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app-nodeport
  template:
    metadata:
      labels:
        app: my-app-nodeport
    spec:
      containers:
        - name: my-container-nodeport
          image: nginx:latest
          ports:
            - containerPort: 80