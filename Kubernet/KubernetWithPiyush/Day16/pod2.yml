apiVersion: v1
kind: Pod
metadata:
  name: memory-demo-3
spec:
  containers:
  - name: memory-demo-3-ctr
    image: polinux/stress:latest
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        memory: "40Mi"
      limits:
        memory: "40Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "50M", "--vm-hang", "1"]

# This pod will be in pending state because the memory request is more than the limit. 
# The pod will not be scheduled on any node because it cannot meet the resource requirements.

# Because argument define 50 mb memory but max memeory limit is 40 mb so this pod will be in pending state.