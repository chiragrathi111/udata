---
# Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-backup
  namespace: registry
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: alpine:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting backup at $(date)"
              BACKUP_FILE="/backup/registry-backup-$(date +%Y%m%d-%H%M%S).tar.gz"
              tar -czf $BACKUP_FILE -C /var/lib/registry .
              echo "Backup created: $BACKUP_FILE"
              echo "Backup size: $(du -h $BACKUP_FILE | cut -f1)"
              
              # Keep only last 7 backups
              cd /backup
              ls -t registry-backup-*.tar.gz | tail -n +8 | xargs -r rm
              echo "Cleanup complete. Current backups:"
              ls -lh registry-backup-*.tar.gz
              echo "Backup completed at $(date)"
            volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
              readOnly: true
            - name: backup-storage
              mountPath: /backup
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "200m"
          restartPolicy: OnFailure
          volumes:
          - name: registry-data
            persistentVolumeClaim:
              claimName: registry-data
          - name: backup-storage
            persistentVolumeClaim:
              claimName: registry-backup

---
# Manual Backup Job (run on-demand)
apiVersion: batch/v1
kind: Job
metadata:
  name: registry-backup-manual
  namespace: registry
spec:
  template:
    spec:
      containers:
      - name: backup
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting manual backup at $(date)"
          BACKUP_FILE="/backup/registry-backup-manual-$(date +%Y%m%d-%H%M%S).tar.gz"
          tar -czf $BACKUP_FILE -C /var/lib/registry .
          echo "Manual backup created: $BACKUP_FILE"
          echo "Backup size: $(du -h $BACKUP_FILE | cut -f1)"
          ls -lh /backup/
        volumeMounts:
        - name: registry-data
          mountPath: /var/lib/registry
          readOnly: true
        - name: backup-storage
          mountPath: /backup
      restartPolicy: Never
      volumes:
      - name: registry-data
        persistentVolumeClaim:
          claimName: registry-data
      - name: backup-storage
        persistentVolumeClaim:
          claimName: registry-backup
  backoffLimit: 3
