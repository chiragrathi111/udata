---
# Registry UI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-ui
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-ui
  template:
    metadata:
      labels:
        app: registry-ui
    spec:
      containers:
      - name: ui
        image: joxit/docker-registry-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: REGISTRY_TITLE
          value: "Private Docker Registry"
        - name: REGISTRY_URL
          value: "http://docker-registry:5000"
        - name: DELETE_IMAGES
          value: "true"
        - name: SHOW_CONTENT_DIGEST
          value: "true"
        - name: NGINX_PROXY_PASS_URL
          value: "http://docker-registry:5000"
        - name: SINGLE_REGISTRY
          value: "true"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Registry UI Service
apiVersion: v1
kind: Service
metadata:
  name: registry-ui
  namespace: registry
spec:
  selector:
    app: registry-uis
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

---
# NodePort for UI access
apiVersion: v1
kind: Service
metadata:
  name: registry-ui-nodeport
  namespace: registry
spec:
  type: NodePort
  selector:
    app: registry-ui
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30800
