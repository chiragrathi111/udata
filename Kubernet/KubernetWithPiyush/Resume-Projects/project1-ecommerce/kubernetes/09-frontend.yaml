---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: html-content
          mountPath: /usr/share/nginx/html
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: html-content
        configMap:
          name: frontend-html

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecommerce
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

---
# Nginx Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ecommerce
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://api-gateway:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

---
# Frontend HTML Content
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: ecommerce
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>E-Commerce Platform - Kubernetes Project</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
                background: white;
                border-radius: 20px;
                padding: 40px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            }
            h1 {
                color: #667eea;
                text-align: center;
                margin-bottom: 10px;
                font-size: 2.5em;
            }
            .subtitle {
                text-align: center;
                color: #666;
                margin-bottom: 40px;
                font-size: 1.2em;
            }
            .services {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin-bottom: 40px;
            }
            .service-card {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 30px;
                border-radius: 15px;
                text-align: center;
                transition: transform 0.3s;
                cursor: pointer;
            }
            .service-card:hover {
                transform: translateY(-10px);
            }
            .service-card h3 {
                margin-bottom: 15px;
                font-size: 1.5em;
            }
            .service-card p {
                opacity: 0.9;
            }
            .api-test {
                background: #f8f9fa;
                padding: 30px;
                border-radius: 15px;
                margin-top: 30px;
            }
            .api-test h2 {
                color: #667eea;
                margin-bottom: 20px;
            }
            .test-buttons {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                margin-bottom: 20px;
            }
            button {
                background: #667eea;
                color: white;
                border: none;
                padding: 12px 24px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 1em;
                transition: background 0.3s;
            }
            button:hover {
                background: #764ba2;
            }
            #result {
                background: white;
                padding: 20px;
                border-radius: 10px;
                border: 2px solid #667eea;
                min-height: 100px;
                max-height: 400px;
                overflow-y: auto;
                font-family: 'Courier New', monospace;
                white-space: pre-wrap;
            }
            .status {
                display: inline-block;
                padding: 5px 15px;
                border-radius: 20px;
                font-size: 0.9em;
                margin: 5px;
            }
            .status.success { background: #d4edda; color: #155724; }
            .status.error { background: #f8d7da; color: #721c24; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🛒 E-Commerce Platform</h1>
            <p class="subtitle">Microservices Architecture on Kubernetes</p>
            
            <div class="services">
                <div class="service-card">
                    <h3>🚪 API Gateway</h3>
                    <p>Routes requests to microservices</p>
                    <p><strong>Port:</strong> 3000</p>
                </div>
                <div class="service-card">
                    <h3>📦 Product Service</h3>
                    <p>Manages product catalog</p>
                    <p><strong>Port:</strong> 3001</p>
                </div>
                <div class="service-card">
                    <h3>👤 User Service</h3>
                    <p>Authentication & users</p>
                    <p><strong>Port:</strong> 3002</p>
                </div>
                <div class="service-card">
                    <h3>🛍️ Order Service</h3>
                    <p>Order processing</p>
                    <p><strong>Port:</strong> 3003</p>
                </div>
                <div class="service-card">
                    <h3>🗄️ MongoDB</h3>
                    <p>Persistent database</p>
                    <p><strong>StatefulSet</strong></p>
                </div>
                <div class="service-card">
                    <h3>⚡ Redis</h3>
                    <p>Caching layer</p>
                    <p><strong>In-Memory</strong></p>
                </div>
            </div>

            <div class="api-test">
                <h2>🧪 Test API Endpoints</h2>
                <div class="test-buttons">
                    <button onclick="testAPI('/')">Gateway Info</button>
                    <button onclick="testAPI('/api/products')">Get Products</button>
                    <button onclick="testAPI('/api/users')">Get Users</button>
                    <button onclick="testAPI('/api/orders')">Get Orders</button>
                    <button onclick="testHealth()">Health Check</button>
                </div>
                <div id="result">Click a button to test the API...</div>
            </div>
        </div>

        <script>
            async function testAPI(endpoint) {
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = 'Loading...';
                
                try {
                    const response = await fetch(endpoint);
                    const data = await response.json();
                    resultDiv.innerHTML = JSON.stringify(data, null, 2);
                    showStatus('success', `✅ Success: ${response.status}`);
                } catch (error) {
                    resultDiv.innerHTML = `Error: ${error.message}`;
                    showStatus('error', `❌ Error: ${error.message}`);
                }
            }

            async function testHealth() {
                const resultDiv = document.getElementById('result');
                const services = [
                    { name: 'API Gateway', url: '/api/../health' },
                ];
                
                resultDiv.innerHTML = 'Checking health...\n\n';
                
                for (const service of services) {
                    try {
                        const response = await fetch(service.url);
                        const data = await response.json();
                        resultDiv.innerHTML += `${service.name}: ✅ Healthy\n`;
                    } catch (error) {
                        resultDiv.innerHTML += `${service.name}: ❌ Error\n`;
                    }
                }
            }

            function showStatus(type, message) {
                const status = document.createElement('div');
                status.className = `status ${type}`;
                status.textContent = message;
                document.querySelector('.api-test').insertBefore(status, document.getElementById('result'));
                setTimeout(() => status.remove(), 3000);
            }
        </script>
    </body>
    </html>
