apiVersion: v1
kind: PersistentVolume
metadata:
  name: task-pv-volume
  labels:
    type: local
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/home" # That is specific node directory

# Commands:-
# kubectl apply -f pv.yml
# kubectl get pv
# kubectl describe pv task-pv-volume
