apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: myuser # Replace with your desired name
spec:
  request: 
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 86400 # 1 day
  usages:
  - client auth

# To create a CertificateSigningRequest (CSR) in Kubernetes, you can use the above YAML manifest. Make sure to replace
#  "myuser" with the desired name for your CSR.
# After creating the CSR, you can approve it using the following command:

# kubectl certificate approve myuser
# Once approved, you can retrieve the signed certificate using:
# kubectl get csr myuser -o jsonpath='{.status.certificate}' | base64 --decode > myuser.crt
# This will save the signed certificate to a file named "myuser.crt". You can also retrieve the private key if needed,
#  but be cautious with

# cat myuser.csr | base64 | tr -d '\n'
# This command encodes the CSR in base64 format, which is required for the "request" field in the CSR manifest.
# after come this code i paste it in the "request" field of the CSR manifest.

# Commands:-
# kubectl apply -f csr.yml
# kubectl certificate approve myuser
# kubectl get csr
# kubectl describe csr myuser

# kubectl get csr myuser -o yaml > issuecrt.yaml
# this commands will gave a new file issuecrt.yaml in which you can find the certificate in base64 format 
# and you can decode it using below command

# If we want created certificate in human readable format, we can use below command:
# kubectl get csr myuser -o jsonpath='{.status.certificate}' | base64 -d > myuser.crt
# 
# openssl x509 -in myuser.crt -noout -dates -subject
# output:
# notBefore=Feb  9 09:30:06 2026 GMT
# notAfter=Feb 10 09:30:06 2026 GMT
# subject=CN = myuser