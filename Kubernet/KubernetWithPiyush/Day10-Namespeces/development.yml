apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  namespace: dev
  labels:
    app: my-app-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app-ns
  template:
    metadata:
      labels:
        app: my-app-ns
    spec:
      containers:
      - name: my-container
        image: nginx:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80